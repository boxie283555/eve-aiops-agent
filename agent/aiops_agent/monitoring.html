const $=id=>document.getElementById(id),node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh',data=null,requestId=0,controller=null,page=0;
const t=key=>words[lang][key]||key,valid=v=>typeof v==='number'&&Number.isFinite(v),fmt=(v,d=0)=>valid(v)?v.toLocaleString(lang==='zh'?'zh-CN':'en-US',{maximumFractionDigits:d}):'—';
function rate(v){if(!valid(v))return '—';const units=['bps','Kbps','Mbps','Gbps','Tbps'];let i=0;while(Math.abs(v)>=1000&&i<4){v/=1000;i++}return fmt(v,1)+' '+units[i]}
function duration(v){if(!valid(v))return '—';return v>=86400?fmt(v/86400,1)+' d':v>=3600?fmt(v/3600,1)+' h':fmt(v/60,0)+' min'}
function date(v){return valid(v)&&v>0?new Date(v*1000).toLocaleString(lang==='zh'?'zh-CN':'en-GB'):'—'}
function empty(box,text=t('noData')){box.replaceChildren(node('div',text,'empty'))}
function link(text,url,cls){const a=node('a',text,cls);a.href=url;return a}
function status(state){return node('span',t(state),'badge '+state)}
function pctColor(v){return v>=95?'var(--red)':v>=80?'var(--amber)':'var(--cyan)'}
function bar(value,max=100,color){const track=node('div',undefined,'bar-track'),fill=node('div',undefined,'bar-fill');fill.style.width=(valid(value)&&max>0?Math.max(0,Math.min(100,value/max*100)):0)+'%';if(color)fill.style.background=color;track.append(fill);return track}
function grafana(report=false){const url=new URL(location.href);url.port='3000';url.pathname='/d/'+(report?(lang==='zh'?'eve-aiops-report':'eve-aiops-report-en'):(lang==='zh'?'eve-aiops-overview':'eve-aiops-overview-en'))+'/network';url.hash='';url.search=new URLSearchParams({from:'now-'+$('period').value,to:'now','var-device':$('device').value==='all'?'$__all':$('device').value,'var-device_visibility':$('includeInactive').checked?'1':'0'});return url.href}
function routeLinks(){for(const [id,path] of [['policyLink','/firewall/'],['configLink','/config/ui'],['healthLink','/health']])$(id).href=path+'?'+new URLSearchParams({lang,...(id==='healthLink'?{site:$('site').value||'all'}:{})});$('grafanaLink').href=grafana();$('reportLink').href=grafana(true)}
function translate(){document.documentElement.lang=lang;$('lang').value=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));$('fullscreen').textContent=t(document.fullscreenElement?'exitFullscreen':'fullscreen');render();routeLinks()}
function options(id,values,label,current){$(id).replaceChildren();const all=node('option',label);all.value='all';$(id).append(all);for(const value of values){const o=node('option',value);o.value=value;$(id).append(o)}$(id).value=['all',...values].includes(current)?current:'all'}
function issueLink(row){if(row.kind==='drift')return '/config/drift/ui?'+new URLSearchParams({device:row.device,lang,status:'open',origin:'observed',unowned:'true'});if(row.kind==='drift_watch')return '/config/ui?'+new URLSearchParams({device:row.id,lang})+'#history';if(row.kind==='backup')return '/config/ui?'+new URLSearchParams({device:row.id,lang})+'#backup';return '#devices'}
function renderStats(){const s=data?.summary||{},box=$('stats');box.replaceChildren();const cards=[['online',s.online,'#5ad8d1','◉',fmt(s.monitored??s.total)+' '+t('units'),'onlineNote','#devices'],['failed',s.failed,'#f3be74','!','', 'failedNote','#issues'],['drift',s.drift,'#a296fc','∆','', 'driftNote','#issues'],['backup',s.backup_failures,'#73a9ff','▧','', 'backupNote','#issues']];for(const [key,val,color,symbol,suffix,note,href] of cards){const c=node('a',undefined,'stat');c.dataset.stat=key;c.href=href;c.style.setProperty('--accent',color);const label=node('div',t(key),'stat-label');label.append(node('span',symbol,'stat-symbol'));const num=node('div',fmt(val),'number');if(suffix)num.append(node('small','/ '+suffix));c.append(label,num,node('div',t(note),'stat-note'));if(key==='backup'&&data)c.append(node('div',fmt(s.backup_observed)+' / '+fmt(s.total)+' '+t('observedBackup'),'stat-note'));box.append(c)}updateDriftCard()}
function updateDriftCard(){const card=document.querySelector('[data-stat="drift"]'),live=data?.drift_live;if(!card||!live)return;card.querySelector('.number').textContent=fmt(live.total);let note=card.querySelector('.watch-status');if(!note){note=node('div',undefined,'stat-note watch-status');card.append(note)}const rows=live.watch_devices||[],good=rows.filter(r=>r.state==='ok').length,run=live.run?.status;note.replaceChildren(node('div',t('watchScope')+' · '+live.interval_seconds+t('watchCadence')),node('div',!live.available?t('watchUnavailable'):!live.enabled?t('watchDisabled'):['error','partial'].includes(run)?t('watchError'):run==='busy'?t('watchBusy'):fmt(good)+' / '+fmt(rows.length)+' '+t('watchHealthy')),node('div',$('auto').checked?t('watchUpdated')+': '+date(live.sampled_at):t('watchPaused')))}
function applyDrift(live){if(!data)return;data.drift_live=live;data.summary.drift=live.total;const old=JSON.stringify(data.issues);data.issues=data.issues.filter(r=>!['drift','drift_watch'].includes(r.kind));const counts=new Map((live.devices||[]).map(r=>[r.id,r.count]));for(const d of data.devices){d.drift=live.available?(counts.get(d.id)??0):null;if(d.drift)data.issues.push({kind:'drift',device:d.name,id:d.id,count:d.drift})}for(const r of live.watch_devices||[])if(['error','stale'].includes(r.state))data.issues.push({kind:'drift_watch',device:r.device,id:r.id,reason:r.reason||'stale_or_missing'});updateDriftCard();if(old!==JSON.stringify(data.issues))renderIssues()}
let driftRequest=false;
async function refreshDrift(){if(!data||driftRequest)return;const turn=requestId,site=$('site').value,device=$('device').value;driftRequest=true;const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),8000);try{const r=await fetch('/api/monitor/drift?'+new URLSearchParams({site,device,include_inactive:$('includeInactive').checked}),{cache:'no-store',signal:abort.signal});if(!r.ok)throw Error('drift');const live=await r.json();if(turn===requestId&&site===$('site').value&&device===$('device').value)applyDrift(live)}catch(e){if(turn===requestId&&data)applyDrift({...data.drift_live,available:false,total:null,devices:[],watch_devices:[],sampled_at:null})}finally{clearTimeout(timeout);driftRequest=false}}
function renderHealth(){const s=data?.summary||{};$('healthValue').textContent=fmt(s.score,1);$('healthArc').setAttribute('stroke-dasharray',(valid(s.score)?Math.max(0,Math.min(100,s.score))/100*515.22:0)+' 516');$('deduction').textContent=fmt(s.deduction,1);$('unassessed').textContent=fmt(s.unassessed,1);$('coverageValue').textContent=valid(s.coverage)?fmt(s.coverage,1)+'%':'—';$('coverageBar').style.width=(valid(s.coverage)?Math.max(0,Math.min(100,s.coverage)):0)+'%'}
function renderIssues(){const box=$('issues');box.id='issues';box.replaceChildren();if(!data||(!data.source_ok&&!data.drift_live?.available)){empty(box,t('currentUnavailable'));$('issueCount').textContent='—';return}const rows=data.source_ok?data.issues:data.issues.filter(r=>['drift','drift_watch'].includes(r.kind));$('issueCount').textContent=String(rows.length);if(!rows.length){empty(box);box.firstChild.textContent=data.config_ok?t('none'):t('configUnavailable');return}for(const row of rows){const a=link('',issueLink(row),'issue');const title=t(row.kind==='collection'?'collection':row.kind+'Issue');const copy=node('div');copy.append(node('strong',row.device+' · '+title));const desc=row.kind==='drift'?fmt(row.count)+' '+t('records'):valid(row.value)?fmt(row.value,1)+'%':t(row.reason||'unknown');copy.append(node('p',desc));a.append(node('span',row.kind==='drift'?'∆':'!','issue-icon'),copy,node('span','↗','issue-arrow'));if(!['drift','backup','drift_watch'].includes(row.kind))a.onclick=()=>{$('deviceSearch').value=row.device;renderDevices()};box.append(a)}}
function ranking(box,rows,max,valueText){box.replaceChildren();if(!rows.length){empty(box);return}for(const row of rows){const e=node('div',undefined,'rank-row'),label=node('div',undefined,'rank-label'),name=node('span',row.name);if(row.subtitle){name.append(node('br'));name.append(node('small',row.subtitle))}label.append(name,node('b',valueText(row.value)));e.append(label,bar(row.value,max,row.color));box.append(e)}}
function renderResources(){const key=$('resource').value,rows=(data?.devices||[]).filter(r=>valid(r[key])).sort((a,b)=>b[key]-a[key]).slice(0,6).map(r=>({name:r.name,subtitle:r.manufacturer+' / '+t(r.device_type),value:r[key],color:pctColor(r[key])}));ranking($('resources'),rows,100,v=>fmt(v,1)+'%');$('resources').append(node('p',t('resourceMissing'),'note'));const versions=(data?.versions||[]).map(r=>({name:r.version==='unknown'?t('unknownVersion'):r.version,value:r.count}));ranking($('versions'),versions,Math.max(1,...versions.map(r=>r.value)),v=>fmt(v)+' '+t('units'))}
function renderProtocols(){const box=$('protocols');box.replaceChildren();for(const key of ['bgp','ospf','overlay']){const rows=(data?.devices||[]).map(r=>r[key]).filter(Boolean),up=rows.reduce((n,r)=>n+r.up,0),total=rows.reduce((n,r)=>n+r.total,0),item=node('div',undefined,'protocol');item.append(node('small',key==='overlay'?'VXLAN':key.toUpperCase()),node('b',rows.length?fmt(up)+' / '+fmt(total):'—'),node('span',t('peerNote')));box.append(item)}}
function tableHead(id,keys){const tr=node('tr');keys.forEach(k=>tr.append(node('th',t(k))));$(id).replaceChildren(tr)}
function percentCell(value){const td=node('td'),div=node('div',undefined,'resource');div.append(bar(value,100,pctColor(value)),node('span',valid(value)?fmt(value,1)+'%':'—'));td.append(div);return td}
function lifecycleCell(r){const cell=node('td'),included=r.health_included!==false;cell.append(node('div',r.status||'Active'),node('span',t(included?'included':'excluded'),'badge '+(included?'':'unknown')));for(const text of [r.exclusion_code?t(r.exclusion_code):'',r.exclusion_reason,r.exclusion_owner?t('owner')+': '+r.exclusion_owner:'',r.exclusion_until?t('until')+': '+r.exclusion_until:'',r.expiry_error?t('expiryError'):''])if(text){const line=node('div',text,'note');line.style.whiteSpace='normal';line.style.maxWidth='260px';cell.append(line)}return cell}
function renderInventory(){const i=data?.inventory,s=data?.summary;$('inventoryState').textContent=i?(i.status==='error'?t('inventoryError'):t('inventoryRefresh')+' · '+i.refresh_interval_seconds+'s')+' · '+t('lastInventory')+': '+date(timestampString(i.last_success_at)):'';if(data?.hidden_devices)$('inventoryState').textContent+=' · '+t('hiddenDevices')+': '+data.hidden_devices;let note=$('scoringScope');if(!note){note=node('p',undefined,'note');note.id='scoringScope';$('healthValue').closest('.health-layout').append(note)}note.textContent=s&&s.health_included!==undefined?t('scoringScope')+': '+s.health_included+' '+t('included')+' · '+s.health_excluded+' '+t('excluded'):''}

function renderInterfaces(){tableHead('interfaceHead',['name','interface','admin','oper','rx','tx']);const q=$('interfaceSearch').value.toLowerCase(),rows=(data?.interfaces||[]).filter(r=>(r.device+' '+r.interface).toLowerCase().includes(q)&&($('interfaceState').value!=='review'||r.admin_up===1&&r.oper_up===0));const pages=Math.max(1,Math.ceil(rows.length/20));page=Math.max(0,Math.min(page,pages-1));const body=$('interfaceRows');body.replaceChildren();for(const r of rows.slice(page*20,page*20+20)){const tr=node('tr');tr.append(node('td',r.device,'device-name'),node('td',r.interface),node('td',r.admin_up==null?'—':t(r.admin_up===1?'up':'down')),node('td',r.oper_up==null?'—':t(r.oper_up===1?'stateUp':'stateDown'),r.admin_up===1&&r.oper_up===0?'warn-text':''),node('td',rate(r.rx_bps)),node('td',rate(r.tx_bps)));body.append(tr)}if(!rows.length){const tr=node('tr'),td=node('td',t('noData'));td.colSpan=6;tr.append(td);body.append(tr)}$('interfaceCount').textContent=fmt(rows.length)+' '+t('ports');$('pageLabel').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
function chart(id,tipId,keys,formatter){const box=$(id),tip=$(tipId),times=data?.trend.timestamps||[],series=data?.trend.series||{};box.replaceChildren();tip.textContent='';const colors={rx:'#5ad8d1',tx:'#a296fc',online:'#73a9ff'},names={rx:t('rx'),tx:t('tx'),online:t('online')},all=keys.flatMap(k=>series[k]||[]).filter(valid);if(!all.length){box.append(node('div',t('noData'),'chart-empty'));box.onpointermove=box.onkeydown=null;return}const width=800,height=220,left=55,right=15,top=20,bottom=30,max=Math.max(1,...all)*1.12,x=i=>left+i*(width-left-right)/Math.max(1,times.length-1),y=v=>height-bottom-v/max*(height-top-bottom),ns='http://www.w3.org/2000/svg';function svgEl(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}const svg=svgEl('svg',{viewBox:`0 0 ${width} ${height}`,preserveAspectRatio:'none','aria-hidden':'true'});for(let i=0;i<4;i++){const value=max*i/3,py=y(value);svg.append(svgEl('line',{x1:left,x2:width-right,y1:py,y2:py,class:'grid'}),svgEl('text',{x:left-8,y:py+3,'text-anchor':'end'},formatter(value)))}for(const index of [0,Math.floor((times.length-1)/2),times.length-1]){const dt=new Date(times[index]*1000),label=$('period').value.endsWith('d')?dt.toLocaleDateString(lang==='zh'?'zh-CN':'en-GB',{month:'short',day:'numeric'}):dt.toLocaleTimeString(lang==='zh'?'zh-CN':'en-GB',{hour:'2-digit',minute:'2-digit'});svg.append(svgEl('text',{x:x(index),y:height-5,'text-anchor':index===0?'start':index===times.length-1?'end':'middle'},label))}for(const key of keys){const vals=series[key]||[];let d='',open=false;vals.forEach((v,i)=>{if(!valid(v)){open=false;return}d+=(open?'L':'M')+x(i).toFixed(2)+','+y(v).toFixed(2)+' ';open=true});svg.append(svgEl('path',{d,fill:'none',stroke:colors[key],'stroke-width':2.2,'vector-effect':'non-scaling-stroke'}));if(vals.filter(valid).length===1){const i=vals.findIndex(valid);svg.append(svgEl('circle',{cx:x(i),cy: function renderCharts(){chart('trafficChart','trafficTip',['rx','tx'],rate);chart('availabilityChart','availabilityTip',['online'],v=>fmt(v,0));$('rangeTag').textContent=$('period').value;$('trafficLegend').replaceChildren();for(const [key,color]of [['rx','#5ad8d1'],['tx','#a296fc']]){const card=node('div',undefined,'traffic-source'),s=node('span',t(key));s.style.setProperty('--color',color);const vals=data?.trend.series[key]||[],index=vals.length-1,v=vals[index];s.append(node('b',rate(v)));card.append(node('small',t('latest')+' · '+date(data?.trend.timestamps?.[index])),s,node('strong',valid(v)?trafficSource(key,index):t('noSample')));$('trafficLegend').append(card)}}
function render(){renderInventory();if(data){const site=$('site').value,device=$('device').value;options('site',data.options.sites,t('allSites'),site);options('device',data.options.devices.map(d=>d.name),t('allDevices'),device)}renderStats();renderHealth();renderIssues();renderResources();renderProtocols();renderDevices();renderFirewalls();renderInterfaces();renderCharts();$('sourceDot').className='dot'+(data?(data.source_ok?' good':' bad'):'');$('sourceText').textContent=t(data?(data.source_ok?'sourceOk':'sourceBad'):'sourceBad');$('sampleTime').textContent=t('sample')+' '+date(data?.sampled_at);$('syncStatus').textContent=t('sync')+': '+date(data?.sync.last_success)+(data?.sync.success===0?' · '+t('syncFailed'):'');routeLinks()}
