services:
  nautobot-db:
    image: postgres:16-alpine
    container_name: eve-aiops-nautobot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NAUTOBOT_DB_NAME:-nautobot}
      POSTGRES_USER: ${NAUTOBOT_DB_USER:-nautobot}
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD:?set NAUTOBOT_DB_PASSWORD}
    volumes:
      - nautobot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NAUTOBOT_DB_USER:-nautobot} -d ${NAUTOBOT_DB_NAME:-nautobot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nautobot-redis:
    image: redis:7-alpine
    container_name: eve-aiops-nautobot-redis
    restart: unless-stopped
    volumes:
      - nautobot-redis-data:/data

  nautobot:
    image: networktocode/nautobot:${NAUTOBOT_VERSION:-2.4.10}
    container_name: eve-aiops-nautobot
    restart: unless-stopped
    depends_on:
      nautobot-db:
        condition: service_healthy
      nautobot-redis:
        condition: service_started
    environment:
      NAUTOBOT_DB_HOST: nautobot-db
      NAUTOBOT_DB_NAME: ${NAUTOBOT_DB_NAME:-nautobot}
      NAUTOBOT_DB_USER: ${NAUTOBOT_DB_USER:-nautobot}
      NAUTOBOT_DB_PASSWORD: ${NAUTOBOT_DB_PASSWORD:?set NAUTOBOT_DB_PASSWORD}
      NAUTOBOT_REDIS_HOST: nautobot-redis
      NAUTOBOT_REDIS_PORT: 6379
      NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY:?set NAUTOBOT_SECRET_KEY}
      NAUTOBOT_ALLOWED_HOSTS: ${NAUTOBOT_ALLOWED_HOSTS:-*}
      NAUTOBOT_CREATE_SUPERUSER: ${NAUTOBOT_CREATE_SUPERUSER:-true}
      NAUTOBOT_SUPERUSER_NAME: ${NAUTOBOT_SUPERUSER_NAME:-admin}
      NAUTOBOT_SUPERUSER_EMAIL: ${NAUTOBOT_SUPERUSER_EMAIL:-admin@example.local}
      NAUTOBOT_SUPERUSER_PASSWORD: ${NAUTOBOT_SUPERUSER_PASSWORD:?set NAUTOBOT_SUPERUSER_PASSWORD}
      NAUTOBOT_SUPERUSER_API_TOKEN: ${NAUTOBOT_SUPERUSER_API_TOKEN:?set NAUTOBOT_SUPERUSER_API_TOKEN}
    ports:
      - "${NAUTOBOT_PORT:-8081}:8080"
    volumes:
      - nautobot-media:/opt/nautobot/media

volumes:
  nautobot-db-data:
  nautobot-redis-data:
  nautobot-media:
